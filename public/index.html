<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="description" content="Skip — la messagerie, les appels audio et vidéo et le partage d'écran que vous aimiez. De retour, en mieux." />
  <meta name="theme-color" content="#5A4FE0" />
  <title>Skip</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http%3A//www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%235A4FE0'/%3E%3Cpath%20d='M9%208%20L17%2016%20L9%2024%20Z'%20fill='white'/%3E%3Cpath%20d='M16%208%20L24%2016%20L16%2024%20Z'%20fill='white'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Installation sur l'écran d'accueil iOS. Safari ignore le manifeste pour
       l'icône et le mode plein écran : il lui faut ces balises, et un PNG. -->
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skip" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/calls.css" />
</head>
<body>
  <!-- Racine de l'application, remplie par app.js -->
  <div id="app" aria-busy="true">
    <div class="empty-state" style="width:100%">
      <div class="spinner spinner--lg"></div>
      <p class="dim">Chargement de Skip…</p>
    </div>
  </div>

  <!-- Couches superposées -->
  <div id="modals"></div>
  <div id="menus"></div>
  <div id="overlays"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:'Segoe UI',sans-serif">
      <h1>Skip a besoin de JavaScript</h1>
      <p>Activez JavaScript dans votre navigateur pour utiliser Skip.</p>
    </div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
  <script>
    // Installation sur l'écran d'accueil et ouverture hors ligne.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
