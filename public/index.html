<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="description" content="Skype — la messagerie, les appels audio et vidéo et le partage d'écran que vous aimiez. De retour, en mieux." />
  <meta name="theme-color" content="#00AFF0" />
  <title>Skype</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300AFF0'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/calls.css" />
</head>
<body>
  <!-- Racine de l'application, remplie par app.js -->
  <div id="app" aria-busy="true">
    <div class="empty-state" style="width:100%">
      <div class="spinner spinner--lg"></div>
      <p class="dim">Chargement de Skype…</p>
    </div>
  </div>

  <!-- Couches superposées -->
  <div id="modals"></div>
  <div id="menus"></div>
  <div id="overlays"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:'Segoe UI',sans-serif">
      <h1>Skype a besoin de JavaScript</h1>
      <p>Activez JavaScript dans votre navigateur pour utiliser Skype.</p>
    </div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
