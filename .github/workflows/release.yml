# Publie une version téléchargeable : construit l'application pour Windows,
# macOS et Linux, puis attache les trois fichiers à une « release » GitHub.
#
# C'est ce que le site de téléchargement (docs/index.html) interroge : il lit
# la dernière version publiée par ce workflow et remplit ses boutons avec les
# fichiers réellement présents. Aucun lien n'est écrit à la main.
#
# Les fichiers ne sont pas signés (aucun certificat n'a été acheté pour ce
# projet de fan) : Windows affichera SmartScreen, macOS demandera une
# autorisation. C'est attendu, et expliqué sur le site comme dans les notes
# de version.

name: Publier une version

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # On ne publie jamais une version dont la suite de tests échoue.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 au minimum : la suite de tests se connecte au serveur avec
          # le client WebSocket natif, qui n'existe pas avant. Le serveur, lui,
          # tourne dès Node 18.
          node-version: '22'

      - run: npm test

      - id: version
        name: Lire le numéro de version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  construire:
    needs: verifier
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Les fichiers .yml sont la liste de versions que l'application
          # installée interroge pour savoir qu'une mise à jour existe. Sans
          # eux, la mise à jour automatique ne verrait jamais rien.
          - systeme: windows
            os: windows-latest
            cible: build:win
            fichiers: |
              desktop/dist/*.exe
              desktop/dist/latest.yml
          - systeme: macos
            os: macos-latest
            cible: build:mac
            fichiers: |
              desktop/dist/*.dmg
              desktop/dist/latest-mac.yml
          - systeme: linux
            os: ubuntu-latest
            cible: build:linux
            fichiers: |
              desktop/dist/*.AppImage
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 au minimum : la suite de tests se connecte au serveur avec
          # le client WebSocket natif, qui n'existe pas avant. Le serveur, lui,
          # tourne dès Node 18.
          node-version: '22'

      - name: Installer les dépendances de l'enveloppe de bureau
        working-directory: desktop
        run: npm install

      - name: Construire
        working-directory: desktop
        # Sans certificat Apple, la découverte automatique d'identité fait
        # échouer la construction au lieu de produire un .dmg non signé.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.cible }}

      # Construire ne prouve rien. Les défauts d'empaquetage — modules ES
      # perdus, package.json absent, ressources oubliées — ne se manifestent
      # qu'au démarrage de l'application installée. On la lance donc pour de
      # vrai, et on interroge le serveur qu'elle embarque.
      - name: Vérifier que l'application construite démarre vraiment
        if: matrix.systeme == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          BINAIRE=desktop/dist/linux-unpacked/skype-reborn-desktop
          xvfb-run -a "$BINAIRE" --no-sandbox --disable-gpu > /tmp/app.log 2>&1 &

          for _ in $(seq 1 60); do
            PORT=$(grep -oE 'localhost:[0-9]+' /tmp/app.log 2>/dev/null | head -1 | cut -d: -f2)
            [ -n "$PORT" ] && break
            sleep 1
          done

          if [ -z "$PORT" ]; then
            echo "::error::l'application construite n'a pas démarré son serveur"
            sed -n '1,60p' /tmp/app.log
            exit 1
          fi

          SANTE=$(curl -fsS --max-time 10 "http://127.0.0.1:$PORT/api/health")
          echo "santé : $SANTE"

          SERVIE=$(node -p "JSON.parse(process.argv[1]).version" "$SANTE")
          ATTENDUE=$(node -p "require('./package.json').version")
          if [ "$SERVIE" != "$ATTENDUE" ]; then
            echo "::error::l'application servie annonce $SERVIE, le dépôt est en $ATTENDUE"
            exit 1
          fi

          # Les sons sont dans extraResources : leur absence ne se voit pas
          # autrement qu'en les demandant.
          #
          # Mais les demander ne suffit pas. Le serveur est une application
          # monopage : une route inconnue renvoie index.html avec un code 200.
          # Un son absent répondait donc « 200 » exactement comme un son
          # présent, et cette vérification ne pouvait rien détecter. C'est le
          # type de contenu qui tranche.
          for SON in skype-ring skype-message skype-login; do
            TYPE=$(curl -fsS --max-time 10 -o /dev/null -w '%{content_type}' \
              "http://127.0.0.1:$PORT/assets/sounds/$SON.mp3")
            case "$TYPE" in
              audio/*) ;;
              *)
                echo "::error::$SON.mp3 manque à l'empaquetage (servi en « $TYPE »)"
                exit 1
                ;;
            esac
          done
          echo "l'application démarre, sert son interface et ses sons en $SERVIE"
          pkill -f skype-reborn-desktop || true

      - uses: actions/upload-artifact@v4
        with:
          name: skype-reborn-${{ matrix.systeme }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  publier:
    needs: [verifier, construire]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verifier.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: recolte

      - name: Rassembler les fichiers
        run: |
          mkdir -p publication
          find recolte -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest*.yml' \) \
            -exec cp {} publication/ \;
          ls -lh publication
          test -n "$(ls -A publication)" || { echo "aucun fichier à publier"; exit 1; }

          # Sans description de version, l'application installée ne saurait pas
          # qu'une mise à jour existe : mieux vaut échouer ici que publier une
          # version que personne ne recevra.
          ls publication/latest*.yml >/dev/null || {
            echo "aucun fichier de description : la mise à jour automatique serait muette"; exit 1;
          }

      - name: Calculer les empreintes SHA-256
        working-directory: publication
        # Uniquement les fichiers que quelqu'un télécharge à la main : les
        # descriptions de version portent déjà leur propre empreinte SHA-512.
        run: |
          sha256sum *.exe *.dmg *.AppImage 2>/dev/null > SHA256SUMS.txt || true
          test -s SHA256SUMS.txt || { echo "aucune empreinte calculée"; exit 1; }
          cat SHA256SUMS.txt

      - name: Rédiger les notes de version
        run: |
          cat > notes.md <<'FIN'
          **Projet de fan, non officiel.** Skype Reborn est une recréation
          indépendante de l'ancien Skype, réalisée par passion. Aucun lien avec
          Microsoft ni avec les équipes de Skype, aucune affiliation. « Skype »
          est une marque de Microsoft, citée ici pour désigner le logiciel
          d'origine.

          ## Télécharger

          | Système | Fichier |
          | --- | --- |
          | Windows 10 / 11 | `Skype-Reborn-Setup-*.exe` |
          | macOS | `Skype-Reborn-*.dmg` |
          | Linux | `Skype-Reborn-*.AppImage` (`chmod +x`, puis lancer) |

          Page de téléchargement : https://lauzalaiah.github.io/Skype/

          ## À savoir avant d'ouvrir le fichier

          Ces fichiers **ne sont pas signés** : aucun certificat de signature de
          code n'a été acheté pour ce projet gratuit.

          - **Windows** affichera « Windows a protégé votre ordinateur » →
            *Informations complémentaires* → *Exécuter quand même*.
          - **macOS** refusera l'ouverture au premier lancement → Réglages
            Système › Confidentialité et sécurité › *Ouvrir quand même*.

          Les empreintes SHA-256 de chaque fichier sont dans `SHA256SUMS.txt`,
          et tout a été construit automatiquement par GitHub Actions à partir du
          code source de ce dépôt — le journal de construction est public.

          ## Mises à jour

          **Windows et Linux** se mettent à jour tout seuls : l'application
          vérifie au démarrage, télécharge en arrière-plan et propose
          « Redémarrer maintenant ». Rien à retélécharger.

          **macOS** ne le peut pas : remplacer une application exige une
          signature Apple, que ce projet gratuit n'a pas. L'application signale
          la nouvelle version et renvoie vers la page de téléchargement.

          ## Ce qui est inclus

          Messagerie complète, appels audio et vidéo, partage d'écran, mise en
          attente, groupes et sondages, fichiers, messages vocaux, messagerie
          vocale, service d'écho (`echo123`), pavé numérique international,
          statuts de présence, thèmes dont *Skype Classic*, et les sons
          d'origine. L'application embarque son propre serveur : elle fonctionne
          sans connexion Internet et range ses données dans votre dossier
          utilisateur.
          FIN

          # Les empreintes sont recopiées DANS les notes, en plus du fichier :
          # un navigateur ne peut pas lire une pièce jointe de release (la
          # redirection de téléchargement n'autorise pas les requêtes d'une
          # autre origine), alors qu'il lit les notes sans difficulté. C'est
          # ainsi que le site de téléchargement les affiche.
          {
            echo
            echo '## Empreintes SHA-256'
            echo
            echo '```'
            cat publication/SHA256SUMS.txt
            echo '```'
          } >> notes.md

          echo "--- notes ---" && cat notes.md

      # Dernier filet avant que les fichiers ne partent chez les utilisateurs.
      # Une mise à jour défectueuse ne se plaint jamais : elle laisse
      # simplement tout le monde sur l'ancienne version, sans bruit.
      - name: Vérifier la publication avant de l'envoyer
        run: |
          PRECEDENTE=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//' || true)
          echo "version déjà publiée : ${PRECEDENTE:-aucune}"
          node scripts/verifier-publication.mjs publication "$VERSION" "$PRECEDENTE"

      - name: Publier la version
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La version $TAG existe déjà : mise à jour des fichiers."
            gh release edit "$TAG" --title "Skype Reborn $VERSION" --notes-file notes.md
            gh release upload "$TAG" publication/* --clobber
          else
            gh release create "$TAG" publication/* \
              --title "Skype Reborn $VERSION" \
              --notes-file notes.md \
              --latest
          fi
          echo "Publié : https://github.com/${{ github.repository }}/releases/tag/$TAG"
