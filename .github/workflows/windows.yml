# Construit l'installateur Windows (.exe) sur un exécuteur Windows réel.
#
# Contrairement à l'iOS, aucun compte développeur ni certificat n'est
# nécessaire pour qu'un .exe s'installe sous Windows : l'archive produite ici
# est directement utilisable. Sans certificat de signature de code, Windows
# affichera l'avertissement SmartScreen habituel pour un logiciel non signé
# (« Plus d'infos » → « Exécuter quand même ») — normal pour un projet
# indépendant, pas une erreur de compilation.

name: Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Vérifier l'application web
        run: npm test

      - name: Installer les dépendances de l'enveloppe de bureau
        working-directory: desktop
        run: npm install

      - name: Construire l'installateur
        working-directory: desktop
        run: npm run build:win

      - uses: actions/upload-artifact@v6
        with:
          name: skype-reborn-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
